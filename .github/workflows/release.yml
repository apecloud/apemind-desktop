name: desktop-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.6-alpha.1'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DSH_DESKTOP_APP_ID: com.apemind.desktop
  DOWNLOAD_TEST_ORIGIN: https://apemind.ai
  ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: package:mac:arm64
            artifact_glob: 'work/dsh-desktop/apps/desktop/.desktop-build/targets/**/artifacts/**/*'
          - name: macOS Intel
            os: macos-15-intel
            target: package:mac:x64
            artifact_glob: 'work/dsh-desktop/apps/desktop/.desktop-build/targets/**/artifacts/**/*'
          - name: Windows x64
            os: windows-latest
            target: package:win:x64
            artifact_glob: 'work/dsh-desktop/apps/desktop/.desktop-build/targets/**/artifacts/**/*'
    runs-on: ${{ matrix.os }}
    env:
      DSH_DESKTOP_UNSIGNED: ${{ startsWith(matrix.os, 'macos-') && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(./scripts/lock-get.sh upstream.version)"
          test "${RELEASE_TAG%%+*}" = "v${VERSION}"

      - name: Check macOS signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for NAME in CERTIFICATE CERTIFICATE_PASSWORD APPLE_APP_SPECIFIC_PASSWORD APPLE_ID APPLE_TEAM_ID SIGNING_IDENTITY; do
            test -n "${!NAME}" || { echo "::error::Missing macOS signing configuration: $NAME"; exit 1; }
          done

      - name: Sync upstream and apply ApeMind overlay
        shell: bash
        run: ./scripts/sync-upstream.sh --work-dir "${RUNNER_TEMP}/dsh-desktop"

      - name: Activate pnpm
        shell: bash
        run: |
          set -euo pipefail
          PM="$(./scripts/lock-get.sh toolchain.package_manager)"
          corepack enable
          corepack prepare "$PM" --activate
          pnpm --version

      - name: Derive workspace lockfile
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY="${GITHUB_WORKSPACE}/overlay/add-files"
          if [ -d "$OVERLAY" ] && [ -n "$(find "$OVERLAY" -type f -print -quit)" ]; then
            pnpm install --lockfile-only --ignore-scripts
          fi

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Prefer native Windows tar
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-tools"
          cat > "$RUNNER_TEMP/native-tools/tar" <<'SCRIPT'
          #!/usr/bin/env bash
          exec /c/Windows/System32/tar.exe "$@"
          SCRIPT
          chmod +x "$RUNNER_TEMP/native-tools/tar"
          echo "$RUNNER_TEMP/native-tools" >> "$GITHUB_PATH"

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/apemind-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/apemind-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/apemind-signing.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          curl --fail --silent --show-error https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security add-certificates -k "$KEYCHAIN" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Prepare platform packaging settings
        working-directory: ${{ runner.temp }}/dsh-desktop/apps/desktop
        shell: bash
        env:
          APP_ID: ${{ env.DSH_DESKTOP_APP_ID }}
          MANDATORY_UPDATE_ORIGIN: https://apemind.ai
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_ID_VALUE: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID_VALUE: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CERTIFICATE_PASSWORD_VALUE: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            cp .env.macos.example .env.macos
            {
              printf 'DSH_DESKTOP_APP_ID=%s\n' "$APP_ID"
              printf 'DSH_DESKTOP_AUTO_UPDATE_ENV=production\n'
              printf 'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=%s\n' "$MANDATORY_UPDATE_ORIGIN"
              printf "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='%s'\n" '{"allowedPageOrigins":["https://apemind.ai"]}'
              printf 'DSH_DESKTOP_MACOS_SIGNING_IDENTITY=%s\n' "$MACOS_SIGNING_IDENTITY"
              printf 'DSH_DESKTOP_MACOS_TEAM_ID=%s\n' "$APPLE_TEAM_ID_VALUE"
              printf 'APPLE_ID=%s\n' "$APPLE_ID_VALUE"
              printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$APPLE_APP_SPECIFIC_PASSWORD_VALUE"
              printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID_VALUE"
              printf 'CSC_LINK=%s\n' "$RUNNER_TEMP/apemind-signing.p12"
              printf 'CSC_KEY_PASSWORD=%s\n' "$CERTIFICATE_PASSWORD_VALUE"
            } >> .env.macos
          else
            cp .env.windows.example .env.windows
            {
              printf 'DSH_DESKTOP_APP_ID=%s\n' "$APP_ID"
              printf 'DSH_DESKTOP_AUTO_UPDATE_ENV=production\n'
              printf 'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=%s\n' "$MANDATORY_UPDATE_ORIGIN"
              printf "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='%s'\n" '{"allowedPageOrigins":["https://apemind.ai"]}'
            } >> .env.windows
          fi

      - name: Package application
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        env:
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          DSH_DESKTOP_MACOS_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run "$PACKAGE_TARGET"

      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/apemind-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/apemind-signing.p12"

      - name: Collect release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find "${RUNNER_TEMP}/dsh-desktop/apps/desktop/.desktop-build/targets" -mindepth 3 -maxdepth 3 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.msi' \) -print -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -print -quit)"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum release-assets/* > release-assets/SHA256SUMS-${{ matrix.os }}.txt
          else
            shasum -a 256 release-assets/* > release-assets/SHA256SUMS-${{ matrix.os }}.txt
          fi
          tar -czf release-assets/${{ matrix.os }}-build-receipt.tgz -C "${RUNNER_TEMP}/dsh-desktop/apps/desktop/.desktop-build" .

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true
      - name: Keep CI receipts out of the public release
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -name '*-build-receipt.tgz' -print -delete
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ApeMind Desktop ${{ inputs.tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE"
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --prerelease
            fi
          else
            create_args=(
              "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --title "$RELEASE_TITLE"
              --generate-notes
            )
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

      - name: Upload release assets idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          for asset in "${assets[@]}"; do
            uploaded=0
            for attempt in 1 2 3 4 5; do
              echo "Uploading $(basename "$asset") (attempt ${attempt}/5)"
              if gh release upload "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber \
                "$asset"; then
                uploaded=1
                break
              fi
              if (( attempt < 5 )); then
                sleep $((attempt * 15))
              fi
            done
            if (( uploaded == 0 )); then
              echo "Failed to upload $(basename "$asset") after 5 attempts" >&2
              exit 1
            fi
          done
