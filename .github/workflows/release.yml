name: desktop-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.6-alpha.1'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DSH_DESKTOP_APP_ID: com.apemind.desktop
  DOWNLOAD_TEST_ORIGIN: https://apemind.ai
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  verify-typecheck:
    name: Verify workspace typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync upstream and apply ApeMind overlay
        shell: bash
        run: ./scripts/sync-upstream.sh --work-dir "${RUNNER_TEMP}/dsh-desktop"

      - name: Activate pnpm
        id: pnpm
        shell: bash
        run: |
          set -euo pipefail
          PM="$(./scripts/lock-get.sh toolchain.package_manager)"
          corepack enable
          corepack prepare "$PM" --activate
          pnpm --version
          echo "store_path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store_path }}
          key: desktop-pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock', 'overlay/add-files/**/package.json') }}
          restore-keys: |
            desktop-pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Derive workspace lockfile
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY="${GITHUB_WORKSPACE}/overlay/add-files"
          if [ -d "$OVERLAY" ] && [ -n "$(find "$OVERLAY" -type f -print -quit)" ]; then
            pnpm install --lockfile-only --ignore-scripts --prefer-offline
          fi

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Typecheck workspace
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        run: pnpm run typecheck

  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: package:mac:arm64
            artifact_glob: 'work/dsh-desktop/apps/desktop/.desktop-build/targets/**/artifacts/**/*'
          - name: macOS Intel
            os: macos-15-intel
            target: package:mac:x64
            artifact_glob: 'work/dsh-desktop/apps/desktop/.desktop-build/targets/**/artifacts/**/*'
          - name: Windows x64
            os: windows-latest
            target: package:win:x64
            artifact_glob: 'work/dsh-desktop/apps/desktop/.desktop-build/targets/**/artifacts/**/*'
    runs-on: ${{ matrix.os }}
    env:
      DSH_DESKTOP_UNSIGNED: ${{ startsWith(matrix.os, 'macos-') && '0' || '1' }}
      # The Windows-hosted runner's bundled LibreOffice Kit cannot reliably load the
      # generated XLSX fixture. Keep the package boot/plugin smoke while skipping
      # only Office conversion coverage; Office conversion remains covered on macOS.
      DSH_DESKTOP_SKIP_OFFICE_SMOKE: ${{ startsWith(matrix.os, 'windows-') && '1' || '0' }}
      # Aggregate host/client typecheck is platform-independent and runs once in parallel
      # on ubuntu-latest (verify-typecheck) before Publish GitHub Release.
      DSH_DESKTOP_BUILD_SCOPE: artifacts
      DSH_DESKTOP_PARALLEL_PREPARE: '1'
      DSH_DESKTOP_PACKAGE_CACHE_DIR: ${{ runner.temp }}/dsh-package-cache
      ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/electron-builder-cache
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="$(./scripts/lock-get.sh upstream.version)"
          test "${RELEASE_TAG%%+*}" = "v${VERSION}"

      - name: Check macOS signing configuration
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          for NAME in CERTIFICATE CERTIFICATE_PASSWORD APPLE_APP_SPECIFIC_PASSWORD APPLE_ID APPLE_TEAM_ID SIGNING_IDENTITY; do
            test -n "${!NAME}" || { echo "::error::Missing macOS signing configuration: $NAME"; exit 1; }
          done

      - name: Sync upstream and apply ApeMind overlay
        shell: bash
        run: ./scripts/sync-upstream.sh --work-dir "${RUNNER_TEMP}/dsh-desktop"

      - name: Activate pnpm
        id: pnpm
        shell: bash
        run: |
          set -euo pipefail
          PM="$(./scripts/lock-get.sh toolchain.package_manager)"
          corepack enable
          corepack prepare "$PM" --activate
          pnpm --version
          echo "store_path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm.outputs.store_path }}
          key: desktop-pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock', 'overlay/add-files/**/package.json') }}
          restore-keys: |
            desktop-pnpm-store-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache desktop packaging downloads and runtime pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ env.DSH_DESKTOP_PACKAGE_CACHE_DIR }}
          key: desktop-pkg-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock', 'overlay/add-files/**/package.json') }}
          restore-keys: |
            desktop-pkg-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache electron-builder binaries
        uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_BUILDER_CACHE }}
          key: desktop-eb-cache-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock') }}
          restore-keys: |
            desktop-eb-cache-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache macOS native signatures
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apemind-macos-sig-cache
          key: desktop-macos-sig-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('upstream.lock') }}-${{ vars.MACOS_SIGNING_IDENTITY }}
          restore-keys: |
            desktop-macos-sig-${{ runner.os }}-${{ runner.arch }}-

      - name: Derive workspace lockfile
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY="${GITHUB_WORKSPACE}/overlay/add-files"
          if [ -d "$OVERLAY" ] && [ -n "$(find "$OVERLAY" -type f -print -quit)" ]; then
            pnpm install --lockfile-only --ignore-scripts --prefer-offline
          fi

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Prefetch bundled ApeMind CLI
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "$PACKAGE_TARGET" in
            package:mac:arm64) CLI_TARGET=darwin-arm64 ;;
            package:mac:x64) CLI_TARGET=darwin-x64 ;;
            package:win:x64) CLI_TARGET=win32-x64 ;;
            *) echo "unsupported Desktop target: $PACKAGE_TARGET" >&2; exit 2 ;;
          esac
          lock="apps/desktop/resources/apemind-cli.lock.json"
          version="$(jq -r '.version' "$lock")"
          url="$(jq -r --arg target "$CLI_TARGET" '.artifacts[$target].url' "$lock")"
          expected="$(jq -r --arg target "$CLI_TARGET" '.artifacts[$target].sha256' "$lock")"
          filename="$(basename "${url%%\?*}")"
          destination="apps/desktop/.desktop-build/apemind-cli/$version/$CLI_TARGET/$filename"
          mkdir -p "$(dirname "$destination")"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 180 "$url" -o "$destination"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "$destination" | awk '{print $1}')"
          else
            actual="$(shasum -a 256 "$destination" | awk '{print $1}')"
          fi
          test "$actual" = "$expected"
          if [[ "$CLI_TARGET" != win32-* ]]; then chmod +x "$destination"; fi

      - name: Prefer native Windows tar
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-tools"
          cat > "$RUNNER_TEMP/native-tools/tar" <<'SCRIPT'
          #!/usr/bin/env bash
          exec /c/Windows/System32/tar.exe "$@"
          SCRIPT
          chmod +x "$RUNNER_TEMP/native-tools/tar"
          echo "$RUNNER_TEMP/native-tools" >> "$GITHUB_PATH"

      - name: Import macOS signing certificate
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN="$RUNNER_TEMP/apemind-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/apemind-signing.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/apemind-signing.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          curl --fail --silent --show-error https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security add-certificates -k "$KEYCHAIN" "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Prepare platform packaging settings
        working-directory: ${{ runner.temp }}/dsh-desktop/apps/desktop
        shell: bash
        env:
          APP_ID: ${{ env.DSH_DESKTOP_APP_ID }}
          MANDATORY_UPDATE_ORIGIN: https://apemind.ai
          MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          APPLE_ID_VALUE: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID_VALUE: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD_VALUE: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          CERTIFICATE_PASSWORD_VALUE: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$DSH_DESKTOP_PACKAGE_CACHE_DIR" "$ELECTRON_BUILDER_CACHE"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            SIG_CACHE_DIR="$(cd "$RUNNER_TEMP" && pwd -P)/apemind-macos-sig-cache"
            mkdir -p "$SIG_CACHE_DIR"
            chmod 700 "$SIG_CACHE_DIR"
            : > .env.macos
            {
              printf 'DSH_DESKTOP_APP_ID=%s\n' "$APP_ID"
              printf 'DSH_DESKTOP_AUTO_UPDATE_ENV=production\n'
              printf 'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=%s\n' "$MANDATORY_UPDATE_ORIGIN"
              printf "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='%s'\n" '{"allowedPageOrigins":["https://apemind.ai"]}'
              printf 'DSH_DESKTOP_MACOS_SIGNING_IDENTITY=%s\n' "$MACOS_SIGNING_IDENTITY"
              printf 'DSH_DESKTOP_MACOS_TEAM_ID=%s\n' "$APPLE_TEAM_ID_VALUE"
              printf 'DSH_DESKTOP_MACOS_SIGNATURE_CACHE_DIR=%s\n' "$SIG_CACHE_DIR"
              printf 'DSH_DESKTOP_MACOS_PACK_CONCURRENCY=8\n'
              printf 'APPLE_ID=%s\n' "$APPLE_ID_VALUE"
              printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$APPLE_APP_SPECIFIC_PASSWORD_VALUE"
              printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID_VALUE"
              printf 'CSC_LINK=%s\n' "$RUNNER_TEMP/apemind-signing.p12"
              printf 'CSC_KEY_PASSWORD=%s\n' "$CERTIFICATE_PASSWORD_VALUE"
            } >> .env.macos
          else
            : > .env.windows
            {
              printf 'DSH_DESKTOP_APP_ID=%s\n' "$APP_ID"
              printf 'DSH_DESKTOP_AUTO_UPDATE_ENV=production\n'
              printf 'DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=%s\n' "$MANDATORY_UPDATE_ORIGIN"
              printf "DSH_DESKTOP_MANDATORY_UPDATE_CONFIG='%s'\n" '{"allowedPageOrigins":["https://apemind.ai"]}'
              printf 'DSH_DESKTOP_WINDOWS_PACK_CONCURRENCY=8\n'
            } >> .env.windows
          fi

      - name: Package application
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        env:
          DSH_DESKTOP_MACOS_SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_IDENTITY }}
          DSH_DESKTOP_MACOS_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          PACKAGE_TARGET: ${{ matrix.target }}
        run: pnpm --filter @deepseek-ai/dsh-desktop run "$PACKAGE_TARGET"

      - name: Remove temporary macOS signing keychain
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/apemind-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/apemind-signing.p12"

      - name: Collect release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets build-receipt
          export RELEASE_TAG="${{ inputs.tag }}"
          while IFS= read -r -d '' file; do
            base="$(basename "$file")"
            case "$base" in
              electron.exe) continue ;;
              *.exe) cp "$file" "release-assets/apemind-desktop-${RELEASE_TAG#v}-win-x64-unsigned.exe" ;;
              *.dmg|*.zip|*.msi) cp "$file" "release-assets/$base" ;;
            esac
          done < <(find "${RUNNER_TEMP}/dsh-desktop/apps/desktop/.desktop-build/targets" -mindepth 3 -maxdepth 3 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.msi' \) -print0)
          test -n "$(find release-assets -type f -print -quit)"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum release-assets/* > release-assets/SHA256SUMS-${{ matrix.os }}.txt
          else
            shasum -a 256 release-assets/* > release-assets/SHA256SUMS-${{ matrix.os }}.txt
          fi
          # Keep lightweight JSON receipts separate from desktop-* artifacts instead of
          # tarring multi-GB unpacked build trees that Publish GitHub Release deletes anyway.
          cp release-assets/SHA256SUMS-${{ matrix.os }}.txt build-receipt/
          while IFS= read -r -d '' receipt; do
            rel="${receipt#${RUNNER_TEMP}/dsh-desktop/apps/desktop/.desktop-build/}"
            mkdir -p "build-receipt/$(dirname "$rel")"
            cp "$receipt" "build-receipt/$rel"
          done < <(find "${RUNNER_TEMP}/dsh-desktop/apps/desktop/.desktop-build/targets" -maxdepth 4 -type f \( -name 'release-record*.json' -o -name 'versions.json' -o -name 'runtime.json' -o -name 'package-set.json' \) -print0)

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release-assets
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: build-receipt-${{ matrix.os }}
          path: build-receipt
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [build, verify-typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true
      - name: Keep CI receipts out of the public release
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -type f -name '*-build-receipt.tgz' -print -delete
      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_TITLE: ApeMind Desktop ${{ inputs.tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TITLE"
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              gh release edit "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --prerelease
            fi
          else
            create_args=(
              "$RELEASE_TAG"
              --repo "$GITHUB_REPOSITORY"
              --target "$GITHUB_SHA"
              --title "$RELEASE_TITLE"
              --generate-notes
            )
            if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
              create_args+=(--prerelease)
            fi
            gh release create "${create_args[@]}"
          fi

      - name: Upload release assets idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(release-assets/*)
          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded" >&2
            exit 1
          fi
          upload_one() {
            local asset="$1"
            for attempt in 1 2 3 4 5; do
              echo "Uploading $(basename "$asset") (attempt ${attempt}/5)"
              if gh release upload "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --clobber \
                "$asset"; then
                return 0
              fi
              if (( attempt < 5 )); then
                sleep $((attempt * 15))
              fi
            done
            echo "Failed to upload $(basename "$asset") after 5 attempts" >&2
            return 1
          }
          max_parallel=4
          pids=()
          failed=0
          for asset in "${assets[@]}"; do
            upload_one "$asset" &
            pids+=($!)
            if (( ${#pids[@]} >= max_parallel )); then
              if ! wait "${pids[0]}"; then
                failed=1
              fi
              pids=("${pids[@]:1}")
            fi
          done
          for pid in "${pids[@]}"; do
            if ! wait "$pid"; then
              failed=1
            fi
          done
          (( failed == 0 ))
