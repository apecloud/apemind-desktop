name: desktop-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v0.1.6-alpha.1'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a prerelease'
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  DSH_DESKTOP_UNSIGNED: '1'
  DSH_DESKTOP_APP_ID: com.apemind.desktop
  DOWNLOAD_TEST_ORIGIN: https://apemind.ai
  ELECTRON_MIRROR: https://registry.npmmirror.com/-/binary/electron/
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-14
            target: package:mac:arm64
            artifact_glob: 'work/dsh-desktop/apps/desktop/.desktop-build/targets/**/artifacts/**/*'
          - name: macOS Intel
            os: macos-15-intel
            target: package:mac:x64
            artifact_glob: 'work/dsh-desktop/apps/desktop/.desktop-build/targets/**/artifacts/**/*'
          - name: Windows x64
            os: windows-latest
            target: package:win:x64
            artifact_glob: 'work/dsh-desktop/apps/desktop/.desktop-build/targets/**/artifacts/**/*'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Configure Git line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf

      - name: Sync upstream and apply ApeMind overlay
        shell: bash
        run: ./scripts/sync-upstream.sh --work-dir "${RUNNER_TEMP}/dsh-desktop"

      - name: Activate pnpm
        shell: bash
        run: |
          set -euo pipefail
          PM="$(./scripts/lock-get.sh toolchain.package_manager)"
          corepack enable
          corepack prepare "$PM" --activate
          pnpm --version

      - name: Derive workspace lockfile
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        run: |
          set -euo pipefail
          OVERLAY="${GITHUB_WORKSPACE}/overlay/add-files"
          if [ -d "$OVERLAY" ] && [ -n "$(find "$OVERLAY" -type f -print -quit)" ]; then
            pnpm install --lockfile-only --ignore-scripts
          fi

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Prefer native Windows tar
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native-tools"
          cat > "$RUNNER_TEMP/native-tools/tar" <<'SCRIPT'
          #!/usr/bin/env bash
          exec /c/Windows/System32/tar.exe "$@"
          SCRIPT
          chmod +x "$RUNNER_TEMP/native-tools/tar"
          echo "$RUNNER_TEMP/native-tools" >> "$GITHUB_PATH"

      - name: Package application
        working-directory: ${{ runner.temp }}/dsh-desktop
        shell: bash
        run: pnpm --filter @deepseek-ai/dsh-desktop run ${{ matrix.target }}

      - name: Collect release assets and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find "${RUNNER_TEMP}/dsh-desktop/apps/desktop/.desktop-build/targets" -mindepth 3 -maxdepth 3 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.msi' \) -print -exec cp {} release-assets/ \;
          test -n "$(find release-assets -type f -print -quit)"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum release-assets/* > release-assets/SHA256SUMS-${{ matrix.os }}.txt
          else
            shasum -a 256 release-assets/* > release-assets/SHA256SUMS-${{ matrix.os }}.txt
          fi
          tar -czf release-assets/${{ matrix.os }}-build-receipt.tgz -C "${RUNNER_TEMP}/dsh-desktop/apps/desktop/.desktop-build" .

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release-assets
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: desktop-*
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ApeMind Desktop ${{ inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-assets/**
